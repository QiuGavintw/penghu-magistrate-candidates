name: 每日政見刷新

on:
  schedule:
    # 每天 UTC 00:00（台北 08:00）執行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只檢查不寫入（dry run）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN 模式 ==="
            python refresh.py --dry-run
          else
            echo "=== 完整刷新 ==="
            python refresh.py
          fi

      - name: Push changes (if any)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變更，跳過 push。"
          else
            git commit -m "chore: 每日政見刷新 ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
